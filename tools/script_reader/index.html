<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《笑谈历史》智能审稿工作台</title>
  <!-- Google Fonts & Tailwind CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked for markdown preview -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dakai: {
              DEFAULT: '#D97706',
              bg: '#FEF3C7',
              border: '#F59E0B',
              dark: '#92400E',
              darkbg: '#291e0a'
            },
            xiaoli: {
              DEFAULT: '#0284C7',
              bg: '#E0F2FE',
              border: '#38BDF8',
              dark: '#075985',
              darkbg: '#082538'
            },
            song: {
              gold: '#D4AF37',
              seal: '#B91C1C',
              bg: '#FDFBF7',
              darkbg: '#171717'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            sans: ['"Noto Sans SC"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.3);
      border-radius: 3px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(150, 150, 150, 0.5);
    }
    .dialogue-text {
      line-height: 1.85;
      letter-spacing: 0.02em;
    }
    .font-size-sm .dialogue-text { font-size: 0.95rem; line-height: 1.7; }
    .font-size-md .dialogue-text { font-size: 1.08rem; line-height: 1.85; }
    .font-size-lg .dialogue-text { font-size: 1.25rem; line-height: 1.95; }
    .font-size-xl .dialogue-text { font-size: 1.4rem; line-height: 2.05; }
    
    .serif-mode .dialogue-text { font-family: 'Noto Serif SC', serif; }

    /* 修改徽章与微光边框 */
    .has-edit-border {
      border-color: rgba(16, 185, 129, 0.45) !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.08) !important;
    }
    .has-edit-border:hover {
      border-color: rgba(16, 185, 129, 0.8) !important;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] dark:bg-[#121212] text-gray-800 dark:text-gray-200 h-screen flex flex-col overflow-hidden select-text">

  <!-- 顶部导航栏 -->
  <header class="h-16 bg-white dark:bg-[#1E1E1E] border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-6 z-20 shrink-0 shadow-sm">
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2">
        <span class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-white font-serif font-bold text-lg shadow-sm">
          笑
        </span>
        <h1 class="text-lg font-bold font-serif tracking-wide text-gray-900 dark:text-gray-100">
          笑谈历史 · 智能审稿工作台
        </h1>
      </div>
      <div class="h-4 w-[1px] bg-gray-300 dark:bg-gray-700"></div>
      <div id="current-ep-badge" class="px-3 py-1 text-xs font-medium rounded-full bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800">
        正在载入集数...
      </div>
    </div>

    <!-- 顶部操作与切换 -->
    <div class="flex items-center space-x-4">
      
      <!-- 修改标记状态与跳转 -->
      <div class="flex items-center space-x-2 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 px-3 py-1.5 rounded-xl text-xs">
        <span class="flex items-center space-x-1 text-emerald-800 dark:text-emerald-300 font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>刚修改 <b id="changed-count-badge" class="font-bold">0</b> 处</span>
        </span>
        <div class="h-3 w-[1px] bg-emerald-300 dark:bg-emerald-700 mx-1"></div>
        <button onclick="navDiff(-1)" class="px-2 py-0.5 hover:bg-emerald-200/50 dark:hover:bg-emerald-800/50 rounded text-emerald-800 dark:text-emerald-300 transition font-medium" title="定位到上一处修改">
          ▲ 上处
        </button>
        <span id="diff-nav-index" class="text-[11px] font-mono font-bold text-emerald-700 dark:text-emerald-400">0/0</span>
        <button onclick="navDiff(1)" class="px-2 py-0.5 hover:bg-emerald-200/50 dark:hover:bg-emerald-800/50 rounded text-emerald-800 dark:text-emerald-300 transition font-medium" title="定位到下一处修改">
          ▼ 下处
        </button>
      </div>

      <div class="h-4 w-[1px] bg-gray-300 dark:bg-gray-700"></div>

      <!-- 视图模式切换 -->
      <div class="bg-gray-100 dark:bg-gray-800 p-1 rounded-lg flex items-center text-xs font-medium text-gray-600 dark:text-gray-400">
        <button id="view-dialogue-btn" onclick="setViewMode('dialogue')" class="px-3 py-1.5 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm flex items-center space-x-1.5 transition">
          <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          <span>对话剧本流</span>
        </button>
        <button id="view-doc-btn" onclick="setViewMode('docs')" class="px-3 py-1.5 rounded-md hover:text-gray-900 dark:hover:text-white flex items-center space-x-1.5 transition">
          <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span>大纲 & 质检报告</span>
        </button>
      </div>

      <div class="h-4 w-[1px] bg-gray-300 dark:bg-gray-700"></div>

      <!-- 字号调节 -->
      <div class="flex items-center space-x-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-lg">
        <button onclick="changeFontSize('sm')" class="w-7 h-7 flex items-center justify-center text-xs rounded hover:bg-white dark:hover:bg-gray-700 transition" title="小字号">A-</button>
        <button onclick="changeFontSize('md')" class="w-7 h-7 flex items-center justify-center text-sm font-semibold rounded hover:bg-white dark:hover:bg-gray-700 transition" title="标准字号">A</button>
        <button onclick="changeFontSize('lg')" class="w-7 h-7 flex items-center justify-center text-base font-bold rounded hover:bg-white dark:hover:bg-gray-700 transition" title="大字号">A+</button>
        <button onclick="changeFontSize('xl')" class="w-7 h-7 flex items-center justify-center text-lg font-black rounded hover:bg-white dark:hover:bg-gray-700 transition" title="特大字号">A++</button>
      </div>

      <!-- 字体衬线切换 -->
      <button id="serif-toggle-btn" onclick="toggleSerif()" class="px-2.5 py-1.5 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs rounded-lg transition" title="切换宋体/黑体">
        宋体
      </button>

      <!-- 暗色模式切换 -->
      <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300">
        <svg id="theme-icon-dark" class="w-4 h-4 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
        <svg id="theme-icon-light" class="w-4 h-4 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
      </button>
    </div>
  </header>

  <!-- 主体工作区 -->
  <div class="flex flex-1 overflow-hidden">

    <!-- 左侧目录导航 -->
    <aside class="w-72 bg-white dark:bg-[#1A1A1A] border-r border-gray-200 dark:border-gray-800 flex flex-col shrink-0">
      <!-- 搜索栏 -->
      <div class="p-3 border-b border-gray-100 dark:border-gray-800">
        <div class="relative">
          <input type="text" id="ep-search" oninput="filterEpisodes()" placeholder="搜索集数 / 人物 / 篇名..." 
                 class="w-full bg-gray-50 dark:bg-gray-800 text-xs px-3 py-2 pl-8 rounded-lg border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500 text-gray-800 dark:text-gray-200">
          <svg class="w-4 h-4 text-gray-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
      </div>

      <!-- 节目列表 -->
      <div id="episode-list" class="flex-1 overflow-y-auto custom-scroll p-2 space-y-1">
        <!-- 动态生成集数 -->
      </div>
    </aside>

    <!-- 中间审稿核心区 -->
    <main id="main-content" class="flex-1 flex flex-col bg-[#FDFBF7] dark:bg-[#161616] overflow-hidden font-size-md">
      
      <!-- 顶部幕次导航标签栏 -->
      <div id="act-bar" class="bg-white dark:bg-[#1E1E1E] border-b border-gray-200 dark:border-gray-800 px-6 py-2.5 flex items-center justify-between shadow-xs">
        <div class="flex items-center space-x-2" id="act-tabs">
          <!-- 动态加载各幕 Tab -->
        </div>

        <!-- 统计指标芯片 -->
        <div id="stats-chips" class="flex items-center space-x-3 text-xs text-gray-500 dark:text-gray-400">
          <span class="flex items-center space-x-1">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            <span>大开: <b id="stat-dk-turns" class="text-amber-700 dark:text-amber-400 font-semibold">-</b> 轮</span>
          </span>
          <span class="flex items-center space-x-1">
            <span class="w-2 h-2 rounded-full bg-sky-500"></span>
            <span>小李: <b id="stat-xl-turns" class="text-sky-700 dark:text-sky-400 font-semibold">-</b> 轮</span>
          </span>
          <span class="h-3 w-[1px] bg-gray-200 dark:bg-gray-700"></span>
          <span>总计: <b id="stat-total-words" class="text-gray-900 dark:text-gray-100 font-bold">-</b> 字</span>
          <span>(约 <b id="stat-duration" class="text-gray-900 dark:text-gray-100 font-bold">-</b> 分钟)</span>
        </div>
      </div>

      <!-- 审稿正文滚动流 -->
      <div id="content-container" class="flex-1 overflow-y-auto custom-scroll p-6 lg:px-16 max-w-5xl mx-auto w-full">
        
        <!-- 对话流容器 -->
        <div id="dialogue-container" class="space-y-6 pb-20">
          <!-- 动态渲染台词 -->
        </div>

        <!-- 文档（大纲/质检报告）容器 -->
        <div id="doc-container" class="hidden pb-20 space-y-6">
          <div class="flex space-x-3 border-b border-gray-200 dark:border-gray-800 pb-3">
            <button onclick="showDocTab('report')" id="tab-report" class="px-4 py-2 rounded-lg bg-amber-500 text-white text-xs font-semibold">独立质检报告</button>
            <button onclick="showDocTab('outline')" id="tab-outline" class="px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-xs font-semibold">节目大纲</button>
            <button onclick="showDocTab('fact')" id="tab-fact" class="px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-xs font-semibold">史料核对与禁区</button>
            <button onclick="showDocTab('topic')" id="tab-topic" class="px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-xs font-semibold">选题卡</button>
          </div>
          <div id="doc-markdown-view" class="prose dark:prose-invert max-w-none text-gray-800 dark:text-gray-200 bg-white dark:bg-[#1E1E1E] p-8 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
            <!-- 渲染的 Markdown 内容 -->
          </div>
        </div>

      </div>

    </main>

  </div>

  <script>
    let episodesData = [];
    let currentEpisode = null;
    let currentActIndex = 0; // 0 for all, 1-4 for specific act
    let currentView = 'dialogue'; // 'dialogue' | 'docs'
    let currentDocType = 'report';
    let isSerif = false;
    let changedCards = [];
    let currentDiffIndex = -1;
    // 跟踪每个被修改卡片的显示状态：默认全是定稿（false），点击后切换为比对（true）
    let cardDiffStates = {};

    // 初始化
    window.addEventListener('DOMContentLoaded', async () => {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
      
      await loadEpisodes();
    });

    // 载入节目列表
    async function loadEpisodes() {
      try {
        const res = await fetch('/api/episodes');
        episodesData = await res.json();
        renderEpisodeList(episodesData);

        // 智能定位默认单集：
        // 1. 优先读取 URL 参数 ?ep= 或 ?folder=
        // 2. 其次读取 localStorage 记忆的上次选择
        // 3. 再次默认选中当前处于生产中的 S08A，没有则默认第 1 个单集
        const params = new URLSearchParams(window.location.search);
        const epParam = params.get('ep');
        const folderParam = params.get('folder');

        let targetEp = null;
        if (epParam) {
          targetEp = episodesData.find(e => e.id.toLowerCase() === epParam.toLowerCase() || e.id.toLowerCase().includes(epParam.toLowerCase()));
        } else if (folderParam) {
          targetEp = episodesData.find(e => e.folder === folderParam || e.folder.includes(folderParam));
        }

        if (!targetEp) {
          const savedFolder = localStorage.getItem('last_selected_episode_folder');
          if (savedFolder) {
            targetEp = episodesData.find(e => e.folder === savedFolder);
          }
        }

        if (!targetEp) {
          targetEp = episodesData.find(e => e.id.includes('S08A') || e.folder.includes('S08A')) || episodesData[0];
        }

        if (targetEp) {
          selectEpisode(targetEp.folder);
        }
      } catch (err) {
        console.error('Failed to load episodes:', err);
      }
    }

    // 渲染左侧节目列表
    function renderEpisodeList(list) {
      const container = document.getElementById('episode-list');
      container.innerHTML = '';

      let currentSeries = '';
      list.forEach(ep => {
        if (ep.series !== currentSeries) {
          currentSeries = ep.series;
          const header = document.createElement('div');
          header.className = 'px-3 pt-3 pb-1 text-[11px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider';
          header.textContent = currentSeries;
          container.appendChild(header);
        }

        const item = document.createElement('div');
        item.id = `ep-item-${ep.folder.replace(/[^a-zA-Z0-9]/g, '_')}`;
        item.className = 'group p-2.5 rounded-xl cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800/60 transition flex items-center justify-between text-xs';
        item.onclick = () => selectEpisode(ep.folder);

        item.innerHTML = `
          <div class="flex items-center space-x-2.5 truncate">
            <span class="w-1.5 h-6 rounded-full bg-transparent group-hover:bg-amber-400 transition ep-indicator"></span>
            <div class="truncate">
              <div class="font-medium text-gray-900 dark:text-gray-200 truncate ep-name">${ep.display_name}</div>
              <div class="text-[10px] text-gray-400 dark:text-gray-500">${ep.act_count} 幕剧本 · ${ep.has_report ? '质检通过' : '待质检'}</div>
            </div>
          </div>
          ${ep.has_report ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0" title="已完成质检"></span>' : ''}
        `;
        container.appendChild(item);
      });
    }

    function filterEpisodes() {
      const query = document.getElementById('ep-search').value.toLowerCase();
      const filtered = episodesData.filter(e => 
        e.display_name.toLowerCase().includes(query) || 
        e.series.toLowerCase().includes(query)
      );
      renderEpisodeList(filtered);
    }

    // 选择一集载入详情
    async function selectEpisode(folder) {
      document.querySelectorAll('#episode-list > div').forEach(el => {
        el.classList.remove('bg-amber-50', 'dark:bg-amber-950/30');
        const indicator = el.querySelector('.ep-indicator');
        if (indicator) indicator.classList.remove('bg-amber-500');
      });

      const selectedId = `ep-item-${folder.replace(/[^a-zA-Z0-9]/g, '_')}`;
      const selectedEl = document.getElementById(selectedId);
      if (selectedEl) {
        selectedEl.classList.add('bg-amber-50', 'dark:bg-amber-950/30');
        const indicator = selectedEl.querySelector('.ep-indicator');
        if (indicator) indicator.classList.add('bg-amber-500');
      }

      try {
        const res = await fetch(`/api/episode?folder=${encodeURIComponent(folder)}`);
        currentEpisode = await res.json();
        
        document.getElementById('current-ep-badge').textContent = currentEpisode.title;
        document.getElementById('changed-count-badge').textContent = currentEpisode.total_changed_turns || 0;
        
        cardDiffStates = {}; // 重置折叠状态
        renderActTabs();
        renderDialogues();

        if (currentView === 'docs') {
          renderDocContent();
        }
      } catch (err) {
        console.error('Error fetching episode data:', err);
      }
    }

    function renderActTabs() {
      const tabsContainer = document.getElementById('act-tabs');
      tabsContainer.innerHTML = '';

      const allTab = document.createElement('button');
      allTab.className = `px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
        currentActIndex === 0 
          ? 'bg-amber-600 text-white shadow-sm' 
          : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'
      }`;
      allTab.textContent = `全篇连续通读 (${currentEpisode.acts.length} 幕)`;
      allTab.onclick = () => { currentActIndex = 0; renderActTabs(); renderDialogues(); };
      tabsContainer.appendChild(allTab);

      currentEpisode.acts.forEach(act => {
        const tab = document.createElement('button');
        tab.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 ${
          currentActIndex === act.act_index 
            ? 'bg-amber-600 text-white shadow-sm' 
            : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'
        }`;
        tab.innerHTML = `
          <span>${act.act_name}: ${act.title}</span>
          ${act.changed_count > 0 ? `<span class="px-1.5 py-0.2 rounded-full text-[10px] bg-emerald-500 text-white font-bold">${act.changed_count}</span>` : ''}
        `;
        tab.onclick = () => { currentActIndex = act.act_index; renderActTabs(); renderDialogues(); };
        tabsContainer.appendChild(tab);
      });

      updateStats();
    }

    function updateStats() {
      if (!currentEpisode) return;

      if (currentActIndex === 0) {
        document.getElementById('stat-dk-turns').textContent = currentEpisode.dk_turns;
        document.getElementById('stat-xl-turns').textContent = currentEpisode.xl_turns;
        document.getElementById('stat-total-words').textContent = currentEpisode.total_words.toLocaleString();
        document.getElementById('stat-duration').textContent = currentEpisode.est_total_duration.replace('分钟', '').trim();
        document.getElementById('changed-count-badge').textContent = currentEpisode.total_changed_turns;
      } else {
        const act = currentEpisode.acts.find(a => a.act_index === currentActIndex);
        if (act) {
          const dk = act.dialogues.filter(d => d.speaker === '大开').length;
          const xl = act.dialogues.filter(d => d.speaker === '小李').length;
          document.getElementById('stat-dk-turns').textContent = dk;
          document.getElementById('stat-xl-turns').textContent = xl;
          document.getElementById('stat-total-words').textContent = act.word_count.toLocaleString();
          document.getElementById('stat-duration').textContent = act.est_duration.replace('分钟', '').trim();
          document.getElementById('changed-count-badge').textContent = act.changed_count;
        }
      }
    }

    // 渲染对话流（默认呈现最舒适的纯净阅读体验）
    function renderDialogues() {
      const container = document.getElementById('dialogue-container');
      container.innerHTML = '';
      changedCards = [];
      currentDiffIndex = -1;

      const actsToRender = currentActIndex === 0 
        ? currentEpisode.acts 
        : currentEpisode.acts.filter(a => a.act_index === currentActIndex);

      actsToRender.forEach(act => {
        const actHeader = document.createElement('div');
        actHeader.className = 'pt-4 pb-2 border-b border-gray-200 dark:border-gray-800';
        actHeader.innerHTML = `
          <div class="flex items-baseline justify-between">
            <h2 class="text-xl font-bold font-serif text-gray-900 dark:text-white flex items-center space-x-3">
              <span>${act.act_name} · ${act.title}</span>
              ${act.changed_count > 0 ? `<span class="px-2 py-0.5 rounded-full text-xs bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 font-sans font-bold">本幕有 ${act.changed_count} 处刚修改</span>` : ''}
            </h2>
            <span class="text-xs text-gray-400">${act.word_count} 字 · ${act.dialogues.length} 话轮</span>
          </div>
          ${act.protagonist ? `<div class="mt-1 text-xs text-amber-700 dark:text-amber-400 font-medium">🎯 绝对主角：${act.protagonist}</div>` : ''}
          ${act.core_task ? `<div class="mt-1 text-xs text-gray-500 dark:text-gray-400">📋 核心任务：${act.core_task}</div>` : ''}
        `;
        container.appendChild(actHeader);

        act.dialogues.forEach((d, idx) => {
          const isDakai = d.speaker === '大开';
          const card = document.createElement('div');
          const cardId = `card-act${act.act_index}-turn${idx + 1}`;
          card.id = cardId;
          
          if (d.is_changed) {
            changedCards.push(cardId);
          }

          // 保持舒服的视觉底色，改过的卡片仅有一条温和的翠绿描边
          card.className = `p-5 rounded-2xl transition border relative ${
            d.is_changed ? 'has-edit-border' : ''
          } ${
            isDakai 
              ? 'bg-amber-50/50 dark:bg-[#1f1a10] border-amber-200/60 dark:border-amber-900/40 shadow-xs' 
              : 'bg-sky-50/50 dark:bg-[#0c1824] border-sky-200/60 dark:border-sky-900/40 shadow-xs'
          }`;

          const isShowingDiff = !!cardDiffStates[cardId];

          card.innerHTML = `
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center space-x-2.5">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${
                  isDakai ? 'bg-amber-600 text-white' : 'bg-sky-600 text-white'
                }">
                  ${d.speaker}
                </span>
                <span class="text-xs font-mono text-gray-400 dark:text-gray-500">
                  ⏱️ ${d.time || '00:00'}
                </span>
                ${d.is_changed ? `
                  <button onclick="toggleCardDiff('${cardId}', ${act.act_index}, ${idx})" 
                          class="px-2 py-0.5 rounded-md text-xs font-semibold cursor-pointer transition flex items-center space-x-1 ${
                            isShowingDiff 
                              ? 'bg-amber-500 text-white shadow-xs' 
                              : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-xs'
                          }" title="点击切换对比">
                    <span>${isShowingDiff ? '👁️ 查看纯净定稿' : '✨ 刚刚修改 (点击对比)'}</span>
                  </button>
                ` : ''}
              </div>
              <span class="text-[11px] text-gray-400 dark:text-gray-500">
                #${idx + 1} (${d.text.length}字)
              </span>
            </div>
            <div id="text-${cardId}" class="dialogue-text text-gray-800 dark:text-gray-100 whitespace-pre-wrap">
              ${isShowingDiff ? d.diff_html : d.text}
            </div>
          `;
          container.appendChild(card);
        });
      });

      updateDiffNav();
      document.getElementById('content-container').scrollTop = 0;
    }

    // 单个卡片点击切换修改对比
    function toggleCardDiff(cardId, actIndex, turnIndex) {
      cardDiffStates[cardId] = !cardDiffStates[cardId];
      const act = currentEpisode.acts.find(a => a.act_index === actIndex);
      if (!act) return;
      const d = act.dialogues[turnIndex];
      const textContainer = document.getElementById(`text-${cardId}`);
      
      const isShowingDiff = cardDiffStates[cardId];
      if (textContainer) {
        textContainer.innerHTML = isShowingDiff ? d.diff_html : d.text;
      }

      // 更新按钮文本
      const card = document.getElementById(cardId);
      const btn = card.querySelector('button');
      if (btn) {
        if (isShowingDiff) {
          btn.className = 'px-2 py-0.5 rounded-md text-xs font-semibold cursor-pointer transition flex items-center space-x-1 bg-amber-500 text-white shadow-xs';
          btn.innerHTML = '<span>👁️ 查看纯净定稿</span>';
        } else {
          btn.className = 'px-2 py-0.5 rounded-md text-xs font-semibold cursor-pointer transition flex items-center space-x-1 bg-emerald-600 hover:bg-emerald-700 text-white shadow-xs';
          btn.innerHTML = '<span>✨ 刚刚修改 (点击对比)</span>';
        }
      }
    }

    // 导航到下一个/上一个修改处
    function navDiff(direction) {
      if (changedCards.length === 0) return;
      currentDiffIndex += direction;
      if (currentDiffIndex >= changedCards.length) currentDiffIndex = 0;
      if (currentDiffIndex < 0) currentDiffIndex = changedCards.length - 1;

      const targetId = changedCards[currentDiffIndex];
      const targetEl = document.getElementById(targetId);
      if (targetEl) {
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        targetEl.classList.add('ring-4', 'ring-emerald-400');
        setTimeout(() => targetEl.classList.remove('ring-4', 'ring-emerald-400'), 1800);
      }
      updateDiffNav();
    }

    function updateDiffNav() {
      const navText = document.getElementById('diff-nav-index');
      if (changedCards.length === 0) {
        navText.textContent = '0/0';
      } else {
        navText.textContent = `${currentDiffIndex >= 0 ? currentDiffIndex + 1 : 0}/${changedCards.length}`;
      }
    }

    function setViewMode(mode) {
      currentView = mode;
      const dBtn = document.getElementById('view-dialogue-btn');
      const docBtn = document.getElementById('view-doc-btn');
      const dContainer = document.getElementById('dialogue-container');
      const docContainer = document.getElementById('doc-container');
      const actBar = document.getElementById('act-bar');

      if (mode === 'dialogue') {
        dBtn.className = 'px-3 py-1.5 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm flex items-center space-x-1.5 transition';
        docBtn.className = 'px-3 py-1.5 rounded-md hover:text-gray-900 dark:hover:text-white flex items-center space-x-1.5 transition';
        dContainer.classList.remove('hidden');
        docContainer.classList.add('hidden');
        actBar.classList.remove('hidden');
      } else {
        docBtn.className = 'px-3 py-1.5 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm flex items-center space-x-1.5 transition';
        dBtn.className = 'px-3 py-1.5 rounded-md hover:text-gray-900 dark:hover:text-white flex items-center space-x-1.5 transition';
        dContainer.classList.add('hidden');
        docContainer.classList.remove('hidden');
        actBar.classList.add('hidden');
        renderDocContent();
      }
    }

    function showDocTab(type) {
      currentDocType = type;
      ['report', 'outline', 'fact', 'topic'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === type) {
          btn.className = 'px-4 py-2 rounded-lg bg-amber-500 text-white text-xs font-semibold';
        } else {
          btn.className = 'px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-xs font-semibold';
        }
      });
      renderDocContent();
    }

    function renderDocContent() {
      if (!currentEpisode) return;
      const view = document.getElementById('doc-markdown-view');
      let md = '';
      if (currentDocType === 'report') md = currentEpisode.report_md || '_暂无质检报告_';
      else if (currentDocType === 'outline') md = currentEpisode.outline_md || '_暂无大纲_';
      else if (currentDocType === 'fact') md = currentEpisode.fact_md || '_暂无史料核对_';
      else if (currentDocType === 'topic') md = currentEpisode.topic_md || '_暂无选题卡_';

      view.innerHTML = marked.parse(md);
    }

    function changeFontSize(size) {
      const main = document.getElementById('main-content');
      main.classList.remove('font-size-sm', 'font-size-md', 'font-size-lg', 'font-size-xl');
      main.classList.add(`font-size-${size}`);
    }

    function toggleSerif() {
      isSerif = !isSerif;
      const main = document.getElementById('main-content');
      const btn = document.getElementById('serif-toggle-btn');
      if (isSerif) {
        main.classList.add('serif-mode');
        btn.textContent = '黑体';
      } else {
        main.classList.remove('serif-mode');
        btn.textContent = '宋体';
      }
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }
  </script>
</body>
</html>
